# Append to the shared proxy only after issuing the TLS certificate.
server {
    listen 80;
    server_name breja.juanariasdev.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name breja.juanariasdev.com;
    ssl_certificate /etc/letsencrypt/live/breja.juanariasdev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/breja.juanariasdev.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;
    resolver 127.0.0.11 ipv6=off valid=10s;
    location / {
        set $breja_upstream http://breja-web:4173;
        proxy_pass $breja_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
